version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - is-net
    # Проверка готовности базы (чтобы приложение не спешило)
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  isapp:
    image: isapp:lab8
    container_name: isapp
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - App__Version=0.1.0-lab8
      # Убрали кавычки из пароля!
      - ConnectionStrings__Mssql=Server=mssql;Database=IsLabDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
    ports:
      - "127.0.0.1:5000:8080"
    networks:
      - is-net
    restart: always

networks:
  is-net:
    driver: bridge

volumes:
  mssql_data:
